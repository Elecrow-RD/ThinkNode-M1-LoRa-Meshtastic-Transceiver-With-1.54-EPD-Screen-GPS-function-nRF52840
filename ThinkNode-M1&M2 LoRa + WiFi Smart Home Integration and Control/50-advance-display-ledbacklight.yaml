esphome:
  name: 50-advance-display-ledbacklight
  friendly_name: 5.0_Advance_Display_led&backlight

  platformio_options:
    build_flags: "-DBOARD_HAS_PSRAM"
    board_build.esp-idf.memory_type: qio_opi
    board_build.flash_mode: dio
  on_boot:
    priority: 600.0
    then:
      - lambda: |-
          uint8_t cmd[1] = { 0x10 };
          id(bus_a).write(0x30, cmd, 1);  

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: y
      CONFIG_ESP32S3_DATA_CACHE_64KB: y
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y

psram:
  mode: octal
  speed: 80MHz 

# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "mycyeBgMjBf7XELxpPigNHi8cJEEjp/UOJbKViO9Xuk="

ota:
  - platform: esphome
    password: "1769c58e7db6ddc3f5d120f892ff87c1"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "TP-LINK_503C"
    password: "123456789"

captive_portal:

switch:
  - platform: gpio
    pin: GPIO44
    name: "LED"
    id: led_output
    on_turn_on:
      - lvgl.image.update:
          id: lvgl_light
          src: light_on
    on_turn_off:
      - lvgl.image.update:
          id: lvgl_light
          src: light_off


  - platform: template
    name: "Backlight Power"
    id: backlight_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: |-
          uint8_t cmd[1] = { 0x10 };
          id(bus_a).write(0x30, cmd, 1);
    turn_off_action:
      - lambda: |-
          uint8_t cmd[1] = { 0x05 };
          id(bus_a).write(0x30, cmd, 1);

image:
  - file: "ledon.png"
    id: light_on
    resize: 226x246
    type: RGB565
    transparency: alpha_channel
  - file: "ledoff.png"
    id: light_off
    resize: 226x246
    type: RGB565
    transparency: alpha_channel
  - file: "background.jpg"
    id: background_img
    resize: 800x480   
    type: RGB565
    transparency: alpha_channel

i2c:
  sda: 15
  scl: 16
  scan: true
  id: bus_a

display:
  - platform: rpi_dpi_rgb
    id: main_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: 42
    hsync_pin: 40
    vsync_pin: 41
    pclk_pin: 39
    pclk_frequency: 20MHz
    hsync_pulse_width: 4
    hsync_front_porch: 8
    hsync_back_porch: 8
    vsync_pulse_width: 4
    vsync_front_porch: 8
    vsync_back_porch: 8
    data_pins:
      red:
        - 7
        - 17
        - 18
        - 3
        - 46
      green:
        - 9
        - 10
        - 11
        - 12
        - 13
        - 14
      blue:
        - 21
        - 47
        - 48
        - 45
        - 38

time:
  - platform: homeassistant
    id: time_comp

lvgl:
  widgets:
    - image:
        id: background_img_widget
        src: background_img
        x: 0
        y: 0
        width: 800
        height: 480    
    - image:
        id: lvgl_light
        src: light_off    
        x: 280          
        y: 120
    